name: macOS distribution
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Optional: assemble installers using verified unchanged native artifacts from this run"
        required: false
        default: ""
  push:
    branches: [codex/macos-distribution, codex/independent-datasets, codex/annual-settlement]
    paths:
      - backend/**
      - scripts/**
      - packaging/**
      - frontend/**
      - .github/workflows/macos-distribution.yml
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: ${{ !inputs.native_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements-macos-build.txt
      - run: brew install tesseract
      - run: python scripts/prepare-macos-assets.py
      - run: npm install --global pnpm@10
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run test && pnpm --dir frontend run build
      - run: python scripts/build-macos.py
      - run: python scripts/check-distribution.py --executable release/FinancialFeeSystem/FinancialFeeSystem --work /tmp/ff-accept
      - run: python scripts/run-backend-tests.py --work /tmp/ff-tests
      - run: tar -czf runtime-${{ matrix.arch }}.tar.gz -C release FinancialFeeSystem native-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: runtime-${{ matrix.arch }}.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.arch }}
          retention-days: 7
          path: |
            /tmp/ff-tests/*.log
            /tmp/ff-tests/*.xml
            /tmp/ff-accept/*.json
            /tmp/ff-accept/*.pdf
            /tmp/ff-accept/*.log
  assemble:
    needs: native
    if: ${{ !cancelled() && (needs.native.result == 'success' || inputs.native_run_id) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: artifacts
          run-id: ${{ inputs.native_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/assemble-macos.py --arch ${{ matrix.arch }} --archives artifacts --runtimes runtimes --output release
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-installer-${{ matrix.arch }}
          path: release/*.dmg
          retention-days: 7
  verify-dmg:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-macos-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: Mac-installer-${{ matrix.arch }}
          path: artifacts
      - run: |
          hdiutil attach artifacts/FinancialFeeSystem-*-Mac-${{ matrix.arch }}.dmg -mountpoint /tmp/ff-dmg -nobrowse -readonly
          grep -F "${{ matrix.arch }}" /tmp/ff-dmg/安装说明.txt
          ditto "/tmp/ff-dmg/金融计划收费系统.app" "/tmp/金融计划收费系统.app"
          hdiutil detach /tmp/ff-dmg
          codesign --verify "/tmp/金融计划收费系统.app"
          test "$(lipo -archs "/tmp/金融计划收费系统.app/Contents/MacOS/FinancialFeeSystem")" = "${{ matrix.arch }}"
          test "$(ls "/tmp/金融计划收费系统.app/Contents/Resources")" = "runtime-${{ matrix.arch }}"
          python scripts/check-macos-first-launch.py --app "/tmp/金融计划收费系统.app" --work /tmp/ff-first
          python scripts/check-distribution.py --executable "/tmp/金融计划收费系统.app/Contents/MacOS/FinancialFeeSystem" --work /tmp/ff-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-evidence-${{ matrix.runner }}
          retention-days: 7
          path: |
            /tmp/ff-final/*.json
            /tmp/ff-final/*.log
            /tmp/ff-final/*.pdf
            /tmp/ff-first/*.json
            /tmp/ff-first/*.log
